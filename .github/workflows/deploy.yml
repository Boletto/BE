name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: boletto-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore production secret files
        env:
          BOLETTO_SECRET: ${{ secrets.BOLETTO_SECRET }}
          BOLETTO_FIREBASE_SECRET: ${{ secrets.BOLETTO_FIREBASE_SECRET }}
          BOLETTO_OCI_SECRET: ${{ secrets.BOLETTO_OCI_SECRET }}
          BOLETTO_APPLE_SECRET_FILE_PATH: ${{ secrets.BOLETTO_APPLE_SECRET_FILE_PATH }}
          BOLETTO_APPLE_SECRET_FILE: ${{ secrets.BOLETTO_APPLE_SECRET_FILE }}
        run: |
          set -euo pipefail
          umask 077
          resources=src/main/resources
          mkdir -p "$resources/$(dirname "$BOLETTO_APPLE_SECRET_FILE_PATH")"
          printf '%s' "$BOLETTO_SECRET" | base64 --decode > "$resources/application-secret.yml"
          printf '%s' "$BOLETTO_FIREBASE_SECRET" | base64 --decode > "$resources/firebase-adminsdk.json"
          printf '%s' "$BOLETTO_OCI_SECRET" | base64 --decode > "$resources/oci-private-key.pem"
          printf '%s' "$BOLETTO_APPLE_SECRET_FILE" | base64 --decode > "$resources/$BOLETTO_APPLE_SECRET_FILE_PATH"

      - name: Build application
        run: |
          chmod +x gradlew
          ./gradlew bootJar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/deploy:boletto-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/deploy:boletto_server
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy with rollback
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.BOLETTO_HOST }}
          username: ${{ secrets.BOLETTO_USERNAME }}
          key: ${{ secrets.BOLETTO_KEY }}
          port: ${{ secrets.BOLETTO_PORT }}
          command_timeout: 10m
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -eu
            docker_logout() {
              docker logout >/dev/null 2>&1 || true
            }
            trap docker_logout EXIT
            printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

            image="$DOCKERHUB_USERNAME/deploy:boletto-${{ github.sha }}"
            current=boletto
            previous=boletto_previous

            test -f /home/ubuntu/secret/wallet/tnsnames.ora
            docker pull "$image"
            docker rm -f "$previous" >/dev/null 2>&1 || true

            if docker container inspect "$current" >/dev/null 2>&1; then
              docker stop "$current"
              docker rename "$current" "$previous"
            fi

            rollback() {
              docker rm -f "$current" >/dev/null 2>&1 || true
              if docker container inspect "$previous" >/dev/null 2>&1; then
                docker rename "$previous" "$current"
                docker start "$current"
              fi
            }

            if ! docker run -d \
              --name "$current" \
              --restart unless-stopped \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              -p 127.0.0.1:8080:8080 \
              -v /home/ubuntu/secret/wallet:/secret/wallet:ro \
              "$image"; then
              rollback
              exit 1
            fi

            healthy=false
            for attempt in $(seq 1 40); do
              if ! docker inspect -f '{{.State.Running}}' "$current" 2>/dev/null | grep -q true; then
                break
              fi
              if curl --silent --output /dev/null --connect-timeout 2 http://127.0.0.1:8080/; then
                healthy=true
                break
              fi
              sleep 3
            done

            if [ "$healthy" != true ]; then
              docker logs --tail 200 "$current" || true
              rollback
              exit 1
            fi

            docker rm -f "$previous" >/dev/null 2>&1 || true
            docker image prune -f >/dev/null
            docker ps --filter "name=^/${current}$"
