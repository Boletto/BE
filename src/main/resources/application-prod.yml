datasource:
  driver-class-name: ${secret.datasource.driver-class-name}
  username: ${secret.datasource.username}
  password: ${secret.datasource.password}
  url: ${secret.datasource.url}

jpa:
  hibernate:
    ddl-auto: update
  properties:
    hibernate:
      dialect: org.hibernate.dialect.OracleDialect
      format_sql: false
      show_sql: false
      use_sql_comments: false

security:
  oauth2:
    client:
      registration:
        kakao:
          redirect-uri: https://boletto.gicheok.store/login/oauth2/code/kakao

server:
  forward-headers-strategy: framework

logging:
  level:
    root: info
    #    org.springframework.security: debug
    #    org.springframework.web: info
    com.demoboletto: info
